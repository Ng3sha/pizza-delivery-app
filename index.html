<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Pizza Delivery</title>
</head>
<body class="m-auto" font-inter>
    <section class="bg-white w-[1310px] align-center" m-auto>
        <nav class="flex gap-[364px] h-[64px] items-center mt-[62px]">
            <img class="w-[42px]" src="./images/pizza.png" alt="logo">
            <div class="flex items-center gap-10  font-Inter text-sm text-[#191720]">
                <p>Resturants</p>
                <p>Recipe</p>
                <p>About</p>
                <div class="flex items-center gap-2">
                    <p>Price</p>
                    <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#FFFFFF"><path d="M480-344 240-584l47.33-47.33L480-438.67l192.67-192.66L720-584 480-344Z"/></svg>
                </div>
            </div>
            <button class="bg-[#E94339] w-[115px] h-[65px] rounded-full text-white">Sign Up</button> 
        </nav>
        <section class="flex w-[1264px] h-[478px] mt-[62px] space-between gap-[109px] items-center">
            <div class="w-[585px] h-[405px]">
                <p class="font-inter font-bold text-6xl w-[585px]">Your Favorite Food Delivery Partner</p>
                <p class="font-inter font-normal text-lg text-[#191720] w-[528px] mt-[20px]">The food at your doorstep. Why starve when you have us. You hunger partner. Straight out of the oven to your doorstep. </p>
                <div>
                    <div class="relative">
                        <input class="bg-[#F6F6F6] w-[464px] h-[64px] mt-[50px] border rounded-full py-2 px-4 font-inter text-sm" type="search" name="search" id="search" placeholder="Enter your delivery location">
                        <button class="absolute top-[55px] right-[130px] bg-[#FF5331] shadow-transparent w-[134px] h-[52px] text-lg rounded-full text-white ml-[10px]">Order Now</button>
                    </div>
                    <div class="flex justify-space between gap-5">
                        <div class="flex items-center gap-2 mt-[20px] w-[187px] h-[68px] bg-[#F4F4F4] rounded-md px-4 py-2">
                            <img src="./images/apple.svg" alt="apple logo">
                            <img src="./images/Texto.png" alt="Texto">
                        </div>
                        <div class="flex items-center gap-2 mt-[20px] w-[187px] h-[68px] bg-[#F4F4F4] rounded-md px-4 py-2">
                            <img src="./images/Google Play logo.svg" alt="google logo">
                            <img src="./images/Group 147.png" alt="Texto">
                        </div>
                    </div>
                </div>
            </div>
            <div class="w-[570px] h-[478px] bg-[#F2EBDA] rounded-lg relative">
                <img class="w-[500px] h-[452px] absolute top-[40px]" src="images/Images.png" alt="Driver">
            </div>
        </section>
    </section>
</body>
</html>
